<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <style>
        .google
            {
                width: 400px;
                margin: auto;
                display: block;
            }
        .searchbar
            {
                display: block;
                margin: auto;
                font-size: 25px;
                padding: 10px 250px 10px 25px;
                width: 500px;
                border-radius: 50px;
                border:none;
                box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.5);
                margin-bottom: 35px;
            }
        div
            {
                display: block;
                text-align: center;
                margin: auto;
                font-family: Arial;
            }
        button
            {
                background-color: rgb(231, 231, 231);
                border: none;
                padding:15px;
                font-size: 15px;
                cursor: pointer;
                transition: opacity 0.15s;
            }
            button:hover
                {
                    opacity: 0.7;
                }
        .search
            {
                margin-right: 15px;
            }
    </style>
</head>
<body>
    <img src="photos/google-.png" class="google">
    <input type="text" class="searchbar" placeholder="Search Google or type a URL">
    <div>
        <button class="search">Google Search</button>
        <button class="lucky">I'm Feeling Lucky</button>
    </div>
    
</body>
</html>
