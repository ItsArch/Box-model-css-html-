<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>add friend</title>
</head>
    <style>
        div
            {
                margin: auto;
                width: 250px;
                box-shadow: 0px 1px 10px rgba(0, 0, 0, 0.4);
                font-family: Tahoma;
            }
        .suho
            {
                width: 250px;
            }
        .name
            {
                font-weight: bold;
                margin-left: 10px;
                font-size: large;
                margin-bottom: 5px;
            }
        .friends
            {
                color: rgb(100, 100, 100);
                margin-left: 10px;
                margin-top: 0px;
            }
        button
            {
                margin-left: 10px;
                margin-bottom: 10px;
                background-color: rgb(0, 153, 255);
                color: white;
                border: none;
                border-radius: 5px;
                padding: 10px 20px 10px 20px;
                cursor: pointer;

                transition: opacity 0.15s;
            }
            button:hover
                {
                    opacity: 0.7;
                }
    </style>
<body>
    <div>
        <img src="photos/ahnsuho2.webp" class="suho">
        <p class="name">Ahn Su-ho</p>
        <p class="friends">3 mutual friends</p>
        <button>Add Friend</button>
    </div>
</body>
</html>
