<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tweet</title>
    <style>
        .suho
            {
                width:50px;
                border-radius: 500px;
                vertical-align: middle;
                margin-left: 15px;
            }
        .text
        {
            margin-left: 10px;
            font-family: tahoma;
            color: rgb(112, 112, 112);
            vertical-align: middle;
        }
        button
            {
                background-color: rgb(0, 153, 255);
                border: none;
                color: white;
                font-weight: bold;
                margin-left: 100px;
                padding: 5px 10px 5px 10px;
                border-radius: 20px;
                cursor: pointer;
                vertical-align: middle;

                transition: opacity 0.15s;
            }
            button:hover
                {
                    opacity: 0.8;
                }
        div
            {
                border-style: none;
                width: 400px;
                border-radius: 10px;
                box-shadow: 0px 1px 10px rgba(0, 0, 0, 0.4);
            }
        .user
            {
                padding-top: 15px;
                padding-bottom: 15px;
            }
    </style>
</head>
<body>
    <div>
        <p class="user"><img src="photos/ahnsuho.png" class="suho"> <span class="text">What's Happening?</span> <button>Tweet</button></p>
    </div>
    
    
</body>
</html>
