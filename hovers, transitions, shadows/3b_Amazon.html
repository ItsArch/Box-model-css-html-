<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
</head>
<body>
    <style>
        button {
            border: none;
            border-radius: 12px;
            background-color: rgb(255, 216, 20);
            width: 150px;
            height: 25px;
            cursor: pointer;

            transition: background-color 0.15s;
        }
        button:hover
            {
                background-color: rgb(255, 200, 20);;
            }
    </style>
    <button>Add to Cart</button>
</body>
</html>
