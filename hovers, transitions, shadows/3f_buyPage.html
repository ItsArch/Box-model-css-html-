<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amazon</title>
</head>
<body>
    <style>
        .link
            {
                color: rgb(0,113,133);
                font-size: 20px;
                transition: color 0.15s;
            }
            .link:hover
                {
                    color: rgb(194, 126, 0);
                }
        .price
            {
                color: rgb(0,118,0);
                font-size: 25px;
            }

        .shoes {
            font-weight: bold;
            font-size: 30px;
        }
        .delivery
            {
                font-size: 25px;
            }
        .cart {
            border: none;
            border-radius: 12px;
            background-color: rgb(255, 216, 20);
            width: 100px;
            height: 25px;
            cursor: pointer;
            
            transition: background-color 0.15s, opacity 0.15s;
        }
        .cart:hover
            {
                background-color: rgb(231, 195, 16);
            }
        .cart:active
            {
                opacity: 0.7;/*from 0 to 1*/
            }

        .buy {
            border: none;
            border-radius: 12px;
            background-color: rgb(255, 181, 20);
            width: 100px;
            height: 25px;
            cursor: pointer;

            transition: background-color 0.15s, opacity 0.15s;
        }
        .buy:hover
            {
                background-color: rgb(230, 157, 0);
            }
        .buy:active
            {
                opacity: 0.7;
            }

        
    </style>

    <a href="https://www.amazon.co.uk/" target="_blank" class="link">Back to Amazon</a>
    <br>
    <p class="shoes">Nike Black Running Shoes</p>
    <p class="price">$39 - in stock</p>
    <p class="delivery">Free delivery tomorrow.</p>
    <button class="cart">Add to cart</button>
    <button class="buy">Buy now</button>
</body>
</html>
