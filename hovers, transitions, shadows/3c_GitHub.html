<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub</title>
</head>
<body>
    <style>
        button {
            border: none;
            border-radius: 5px;
            background-color: rgb(46, 164, 79);
            color: white;
            width: 86px;
            height: 36px;
            cursor: pointer;

            transition: box-shadow 0.15s;
        }
        button:hover
            {
                box-shadow: 2px 5px 5px rgba(0, 0, 0, 0.3);
            }
    </style>
    <button>Sign up</button>
</body>
</html>
