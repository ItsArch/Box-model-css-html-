<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>linkedln</title>
</head>
<body>
    <style>
        .apply {
            border: none;
            border-radius: 18px;
            background-color: rgb(10, 102, 194);
            color: white;
            font-weight: bold;
            width: 200px;
            height: 35px;
            cursor: pointer;
            margin-right: 8px;

            transition: background-color 0.2s;
        }
        .apply:hover
            {
                background-color:rgb(10, 44, 194);
            }

        .save{
            border: solid;
            border-color: rgb(10, 102, 194);
            background-color: white;
            color: rgb(10, 102, 194);
            font-weight: bold;
            border-width: 1px;
            border-radius: 18px;
            width: 70px;
            height: 36px;
            cursor: pointer;

            transition: background-color 0.15s;
        }
        .save:hover
            {
                border-width: 2px;
                background-color: rgb(157, 202, 247);
            }
    </style>
    <button class="apply">Apply on company website</button>
    <button class="save">Save</button>
</body>
</html>
