<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdana</title>
</head>
<body>
    <style>
        p{
            font-family: Verdana;
            margin-top: 0px;
            margin-bottom: 0px;
        }
        .title{
            font-weight: bold;
            margin-bottom: 5px;
        }
        .description{
            color: rgb(92, 91, 91);
            margin-bottom: 15px;
        }
        .main{
            width: 280px;
            margin-bottom: 15px;
        }
        button{
            background-color: rgb(1, 99, 1);
            border: none;
            color: white;
            border-radius: 5px;
            padding: 10px 20px 10px 20px;

            transition: opacity 0.15s;
        }
        button:hover
            {
                opacity: 0.7;
            }
        button:active
            {
                opacity: 0.4;
            }
    </style>

    <p class="title">
        HTML CSS COURSE
    </p>
    <p class="description">
        Beginner to Pro
    </p>
    <p class="main">
        In this course, we'll learn the skills you need to become a developer.
    </p>

    <button>Get Started</button>
</body>
</html>
