<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mac book pro</title>
</head>
<body>
    <style>
        p{
            text-align: center;
            font-family: Arial;
            margin-top: 0px;
            margin-bottom: 0px;
        }

        .new{
            color: rgb(216, 123, 1);
            font-size: 25px;
            margin-bottom: 15px;
        }

        .iteam
            {
                font-size: 35px;
                font-weight: 600;
                margin-bottom: 10px;
            }
        .description
            {
                font-size: 50px;
                font-weight: 600;
                margin-bottom: 15px;
            }
        .price
            {
                font-size: 25px;
                margin-bottom: 15px;
            }
        button
            {
                font-size: 25px;
                color: white;
                background-color: rgb(0, 89, 255);
                border: none;
                padding: 15px 25px 15px 25px;
                border-radius: 50px;

                transition: opacity 0.15s;
            }
        button:hover
            {
                opacity: 0.7;
            }
        button:active
            {
                opacity: 0.5;
            }
        
    </style>

    <p class="new">
        New
    </p>

    <p class="iteam">
        MacBook Pro
    </p>

    <p class="description">
        Supercharged for pros.
    </p>

    <p class="price">
        From $1999
    </p>

    <p>
        <button>Buy</button>
    </p>
</body>
</html>
