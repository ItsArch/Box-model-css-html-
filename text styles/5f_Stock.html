<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock</title>
</head>
<body>
    <style>
        p{
            font-family: Arial;
            margin-top: 0px;
            margin-bottom: 0px;
        }
        
        .dollars
            {
                font-size: 50px;
                margin-bottom: 10px;
            }
            .USD
                {
                    font-size: 30px;
                    color: rgb(102, 102, 102);
                }
        .green
            {
                color: green;
                font-size: 25px;
                margin-bottom: 10px;
            }
        .end
            {
                color: rgb(102, 102, 102);
                font-size: 25px;
            }
            .red
                {
                    color: rgb(192, 1, 1);
                }
    </style>

    <p class="dollars">
        1,049.61 <span class="USD">USD</span>
    </p>

    <p class="green">
        +18.05 (1.75%) today
    </p>

    <p class="end">
        After hours 1,048.00 <span class="red">-1.61 (0.15%)</span>
    </p>
</body>
</html>
