<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tweet</title>
</head>
<body>
    <style>
        p{
            font-family: Arial;
            margin-top: 0px;
            margin-bottom: 0px;
        }
        .account{
            font-weight: bold;
            font-size: 25px;
            margin-bottom: 15px;
        }
        .username{
            color: gray;
            font-weight: lighter;
        }
        .comment
            {
                width: 720px;
                font-size: 23px;
                margin-bottom: 20px;
            }
        .comment2
            {
                font-weight: 400;
                font-size: 23px;
                margin-bottom: 20px;
            }
            .tag
                {
                    color: rgb(0, 140, 255);
                }
    </style>

    <p class="account">
        freeCodeCamp.org <span class="username">@freeCodeCamp 1h</span>
    </p>

    <p class="comment">
        As a web developer, you'll want to make your projects easy to use and navigate around.
    </p>

    <p class="comment2">
        Here <span class="tag">@chp_it</span> outlines the top skills new developers should have.
    </p>
</body>
</html>
