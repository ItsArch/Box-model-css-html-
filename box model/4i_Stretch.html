    
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stretch</title>
</head>
<body>
<!--when you hover over the button it stretches-->
    <style>
        button {
            background-color: rgb(2, 95, 2);
            border: none;
            color: white;
            padding: 10px 25px 10px 25px;

            transition: padding 0.15s;/*adds a transition*/
        }
        button:hover
            {
                padding: 10px 55px 15px 25px; /*stretches the button*/
            }
    </style>
    <button>Stretch</button>
</body>
</html>
