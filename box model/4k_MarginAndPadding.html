<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        button {
            background-color: rgb(2, 95, 2);
            border: none;
            color: white;
            padding: 10px 10px 10px 10px;
            margin-left: 5px;
            margin-right: 5px;
        }
        .One
            {
                transition: padding 0.15s, margin 0.15s;
            }
            .One:hover
                {
                    padding: 10px 15px 10px 15px;
                    margin-right: 0px;
                    margin-left: 0px;
                }
        .Two
            {
                transition: padding 0.15s, margin 0.15s;
            }
            .Two:hover
                {
                    padding: 10px 15px 10px 15px;
                    margin-right: 0px;
                    margin-left: 0px;
                }
        .Three
            {
                transition: padding 0.15s, margin 0.15s;
            }
            .Three:hover
                {
                    padding: 10px 15px 10px 15px;
                    margin-left: 0px;
                }
    </style>

    <button class="One">One</button>
    <button class="Two">Two</button>
    <button class="Three">Three</button>
</body>
</html>
