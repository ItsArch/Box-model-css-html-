
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow</title>
</head>
<body>
    <!--when you click the button it compresses-->
    <style>
            button {
                background-color: rgb(2, 95, 2);
                border: none;
                color: white;
                padding: 10px 25px 10px 25px;
                box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.3);
            }
            button:active
                {
                    margin-top: 1px;
                    margin-left: 1px;
                    box-shadow: 0px 0px 0px;
                }
        </style>
    
    <button>Shadow</button>
</body>
</html>
